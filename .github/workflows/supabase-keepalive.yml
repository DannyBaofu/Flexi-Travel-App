name: Supabase Keep-Alive

# Prevents the free-tier Supabase project from pausing after 7 days of
# inactivity by making one tiny REST request every 3 days.
# Configure repo secrets SUPABASE_URL and SUPABASE_ANON_KEY to activate;
# until then the job exits quietly.

on:
  schedule:
    - cron: '17 3 */3 * *' # every ~3 days at 03:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Supabase secrets not configured yet - skipping keep-alive."
            exit 0
          fi
          curl -sf "$SUPABASE_URL/rest/v1/trips?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" > /dev/null
          echo "Supabase pinged - project stays active."
